    <!-- メイン -->
  <main>
    <div class="container my-6 my-lg-8">
      <!-- コンテンツ（お問い合わせ） -->
      <div class="pb-5">
        <h3 class="border-bottom pb-2">お問い合わせ</h3>
        <p class="fw-bold text-lg-center pt-3">お問い合わせは、こちらのフォームをご利用ください。氏名・会社名、お客様のご連絡先とお問い合せ内容を入力の上、お送りください。</p>
      </div>
      <div>
          <!-- フォーム -->
          <form>
        <!-- お名前 -->
        <div class="row py-3">
          <label for="name" class="col-md-3 col-form-label">お名前 <span class="badge bg-warning text-dark">必須</span></label>
          <div class="col-md-9">
            <div class="form-floating">
              <input type="text" class="form-control" id="name" placeholder="お名前" required>
              <label for="name">お名前を入力してください。</label>
            </div>
          </div>
        </div>
        <!-- 会社名 -->
        <div class="row py-3">
          <label for="name" class="col-md-3 col-form-label">会社名</label>
          <div class="col-md-9">
            <div class="form-floating">
              <input type="text" class="form-control" id="corpname" placeholder="会社名" required>
              <label for="name">会社名を入力してください。</label>
            </div>
          </div>
        </div>
        <!-- メールアドレス -->
        <div class="row py-3">
          <label for="email" class="col-md-3 col-form-label">メールアドレス <span class="badge bg-warning text-dark">必須</span></label>
          <div class="col-md-9">
            <div class="form-floating">
              <input type="email" class="form-control" id="email" placeholder="メールアドレス" required>
              <label for="email">有効な電子メールアドレスを入力してください。</label>
            </div>
          </div>
        </div>
        <!-- 件名 -->
        <div class="row py-3">
          <label for="text" class="col-md-3 col-form-label">電話番号</label>
          <div class="col-md-9">
            <div class="form-floating">
              <input type="text" class="form-control" id="telnumber" placeholder="電話番号" required>
              <label for="text">電話番号を入力してください。</label>
            </div>
          </div>
        </div>
        <!-- 件名 -->
        <div class="row py-3">
          <label for="text" class="col-md-3 col-form-label">件　名 <span class="badge bg-warning text-dark">必須</span></label>
          <div class="col-md-9">
            <div class="form-floating">
              <input type="text" class="form-control" id="mailtitle" placeholder="件名" required>
              <label for="text">件名をお書きください。</label>
            </div>
          </div>
        </div>
        <!-- 内容 -->
        <div class="row py-3">
          <label for="message" class="col-md-3 col-form-label">お問い合わせ内容 <span class="badge bg-warning text-dark">必須</span></label>
          <div class="col-md-9">
            <div class="form-floating">
              <textarea class="form-control" id="message" rows="8" name="message" placeholder="問い合わせ内容" style="height: 300px;"></textarea>
              <label for="message">ご自由にお書きください。</label>
            </div>
          </div>
        </div>
        <!-- 確認ボタン -->
        <div class="row justify-content-end py-3">
          <div class="col-md-9 text-center">
            <button type="submit" class="btn btn-wsdc-ocean text-white" disabled="disabled">確認する</button>
          </div>
        </div>
          </form>
      </div>
    </div>
  </main>
